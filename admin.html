
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f0e6;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }

    .login-box {
      max-width: 590px;
      margin: 30px auto;
      padding: 45px 30px;
      background: white;
      border: 6px solid #111;
      box-shadow: 12px 12px #d71920;
    }

    h1 {
      font-size: 38px;
      font-weight: 900;
      font-style: italic;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    input {
      display: block;
      width: 100%;
      padding: 20px;
      margin: 20px 0;
      border: 5px solid #111;
      background: #e7efff;
      font-size: 18px;
    }

    button {
      padding: 18px 35px;
      background: #d71920;
      color: white;
      border: 5px solid #111;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 25px;
      color: #c51c28;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h1>ADMIN LOGIN</h1>

  <p>Only approved administrators can access this dashboard.</p>

  <form id="loginForm">
    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="username"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button id="loginButton" type="submit">
      LOG IN
    </button>

    <p id="message"></p>
  </form>
</div>

<script type="module">
  // Authentication will be connected to Firebase here.
  // Do not put your password or admin credentials in this file.

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const button = document.getElementById("loginButton");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    message.textContent = "Authentication is not yet connected.";
    button.disabled = true;

    try {
      // Firebase authentication setup is required here.
      // This page alone cannot securely verify your admin account.

      message.textContent =
        "Login system is not configured yet. Please connect Firebase Authentication.";
    } catch (error) {
      message.textContent = "Login failed. Please try again.";
    } finally {
      button.disabled = false;
    }
  });
</script>

</body>
</html>
