
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0d1117;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 35px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      font-size: 35px;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8b949e;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #238636;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #238636;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #8b949e;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="logo">🔐</div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to your account</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Log In
      </button>
    </form>

    <p id="message" role="status"></p>

    <div class="footer">
      Website Login Portal
    </div>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    // PALITAN ITO NG CONFIGURATION MULA SA FIREBASE CONSOLE
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "PASTE_YOUR_AUTH_DOMAIN",
      projectId: "loginsystem-13883",
      storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
      messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Logging in...";
      loginButton.disabled = true;

      try {
        const userCredential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.textContent = "Login successful!";

        // Palitan kung iba ang pangalan ng dashboard file ninyo
        window.location.href = "dashboard.html";

      } catch (error) {
        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email.";
        } else {
          message.textContent = "Login failed: " + error.message;
        }
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>

</body>
</html>
