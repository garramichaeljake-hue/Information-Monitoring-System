
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0d1117;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #161b22;
      padding: 35px;
      border-radius: 15px;
      border: 1px solid #30363d;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #8b949e;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #58a6ff;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Welcome Back!</h2>
    <p class="subtitle">Login to your account</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Email Address"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginBtn">
        Login
      </button>
    </form>

    <p id="message"></p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // PALITAN ITO NG FIREBASE CONFIG NINYO
    const firebaseConfig = {
  apiKey: "AIzaSyA1mrO4T70w89BWK6mQd53GkYVcP1rk9Xk",
  authDomain: "loginsystem-13883.firebaseapp.com",
  projectId: "loginsystem-13883",
  storageBucket: "loginsystem-13883.firebasestorage.app",
  messagingSenderId: "161320159005",
  appId: "1:161320159005:web:d2679eeb82a662bf14c3f4"
};

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      message.textContent = "";
      message.style.color = "#8b949e";

      try {
        await auth.signInWithEmailAndPassword(email, password);

        message.style.color = "#3fb950";
        message.textContent = "Login successful! Welcome!";

        loginBtn.textContent = "Logged In";

      } catch (error) {
        message.style.color = "#f85149";

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Please enter a valid email.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent = "Too many attempts. Please try again later.";
        } else {
          message.textContent = error.message;
        }

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
